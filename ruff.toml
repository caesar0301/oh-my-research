# Ruff configuration for oh-my-research.
#
# The lint rule set is declared explicitly instead of relying on ruff's
# defaults, which have grown between releases (e.g. 0.16 → 0.17 added UP/EXE
# rules to the default selection). Without this file CI results drift with
# whatever ruff version happens to be installed.
#
# Keep this in sync with the version pinned in .github/workflows/ci.yml.

target-version = "py310"

[lint]
# Match ruff's historical default selection (pyflakes + a subset of
# pycodestyle). The Makefile's import-sort step uses `--select I` on the CLI,
# which overrides this selection for that invocation.
select = ["E4", "E7", "E9", "F"]
